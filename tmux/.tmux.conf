# Load TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'

# Baseline sensible defaults for better compatibility and behavior
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard integration for copy-mode yanks
set -g @plugin 'tmux-plugins/tmux-yank'

# Optional Vim/Tmux seamless navigation plugin (disabled by default)
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence: restore tmux sessions, windows, and panes
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatic periodic session saving and auto-restore at startup
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatically saves sessions every 15 minutes
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


# Toggle synchronized panes with a visual warning:
# - Red active border when synchronization is ON
# - Default border color when synchronization is OFF
bind u if -F '#{pane_synchronized}' \
    'setw synchronize-panes off; setw pane-active-border-style fg=default' \
    'setw synchronize-panes on; setw pane-active-border-style fg=red'
# Alternative simple toggle (kept as reference)
#bind u set-window-option synchronize-panes

# Clear all panes in the current window using Prefix + Ctrl-l
bind C-l setw synchronize-panes on \; send-keys C-l \; setw synchronize-panes off

# Resize current pane in fixed steps for faster layout adjustments
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# Interactive keybinding helper popup
set -g @plugin 'alexwforsythe/tmux-which-key'

# Scratch popup session bound to Alt-g:
# - If already in scratch session: detach
# - Otherwise: open or attach scratch in current pane directory
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # Open popup in the same directory as the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# Kanagawa theme configuration (active)
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'wave'
#set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "git cpu-usage ram-usage time"
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-show-powerline true
set -g @kanagawa-cpu-display-load true
set -g @kanagawa-left-icon-padding 1
set -g @kanagawa-show-timezone false
set -g @kanagawa-military-time true
set -g @kanagawa-time-format "%F %R"

# Terminal capabilities and key handling
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys off

# Use Vim-style keys in copy-mode
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Prefix and keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using current working directory
unbind %
unbind '"'
# Alternative split bindings (disabled)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Enable mouse for pane selection, resize, and scroll
set -g mouse on

# Place status bar at the top
set -g status-position top

# Safely kill all sessions except the current one (with confirmation)
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Start window and pane numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Initialize TPM (must be the last plugin-related line)
run '~/.tmux/plugins/tpm/tpm'
