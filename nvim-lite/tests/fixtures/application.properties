# Spring Boot — the config format a Java shop actually edits on a server
spring.application.name=gpgw-paymentms
server.port=8080
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/gpgw?ssl=true
spring.datasource.username=${DB_USER:postgres}
spring.jpa.properties.hibernate.jdbc.batch_size=50
logging.level.org.hibernate.SQL=warn
management.endpoints.web.exposure.include=health,metrics
