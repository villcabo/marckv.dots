name: marckv.dots-testings

x-common: &common
  tty: true
  stdin_open: true
  volumes:
    - .:/root/.marckv.dots:ro
    - /var/run/docker.sock:/var/run/docker.sock
  working_dir: /root
  networks:
    - marckv-net

services:
  # =============================================================================
  # DEBIAN DISTRIBUTIONS
  # =============================================================================

  debian11:
    <<: *common
    build:
      context: .
      args:
        BASE_IMAGE: debian:11
    container_name: marckv-debian11
    hostname: debian11

  debian12:
    <<: *common
    build:
      context: .
      args:
        BASE_IMAGE: debian:12
    container_name: marckv-debian12
    hostname: debian12

  debian13:
    <<: *common
    build:
      context: .
      args:
        BASE_IMAGE: debian:trixie
    container_name: marckv-debian13
    hostname: debian13

  # =============================================================================
  # UBUNTU DISTRIBUTIONS
  # =============================================================================

  ubuntu20:
    <<: *common
    build:
      context: .
      args:
        BASE_IMAGE: ubuntu:20.04
    container_name: marckv-ubuntu20
    hostname: ubuntu20

  ubuntu22:
    <<: *common
    build:
      context: .
      args:
        BASE_IMAGE: ubuntu:22.04
    container_name: marckv-ubuntu22
    hostname: ubuntu22

  ubuntu24:
    <<: *common
    build:
      context: .
      args:
        BASE_IMAGE: ubuntu:24.04
    container_name: marckv-ubuntu24
    hostname: ubuntu24

networks:
  marckv-net:
    driver: bridge
