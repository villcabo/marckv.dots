name: marckv.dots-testings

# Shared startup: installs Docker CLI + Compose plugin from official GitHub release
x-docker-install: &docker-install
  - bash
  - -c
  - |
    set -e
    apt update -qq
    apt install -y -qq curl git wget docker.io
    mkdir -p /usr/local/lib/docker/cli-plugins
    curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
      -o /usr/local/lib/docker/cli-plugins/docker-compose
    chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
    exec bash

services:
  # =============================================================================
  # DEBIAN DISTRIBUTIONS
  # =============================================================================

  debian11:
    image: debian:11
    container_name: marckv-debian-11
    hostname: debian-11
    tty: true
    stdin_open: true
    volumes:
      - .:/root/.marckv.dots:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /root
    command: *docker-install
    networks:
      - marckv-net

  debian12:
    image: debian:12
    container_name: marckv-debian-12
    hostname: debian-12
    tty: true
    stdin_open: true
    volumes:
      - .:/root/.marckv.dots:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /root
    command: *docker-install
    networks:
      - marckv-net

  # =============================================================================
  # UBUNTU DISTRIBUTIONS
  # =============================================================================

  ubuntu20:
    image: ubuntu:20.04
    container_name: marckv-ubuntu-20
    hostname: ubuntu-20
    tty: true
    stdin_open: true
    environment:
      - DEBIAN_FRONTEND=noninteractive
    volumes:
      - .:/root/.marckv.dots:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /root
    command: *docker-install
    networks:
      - marckv-net

  ubuntu22:
    image: ubuntu:22.04
    container_name: marckv-ubuntu-22
    hostname: ubuntu-22
    tty: true
    stdin_open: true
    environment:
      - DEBIAN_FRONTEND=noninteractive
    volumes:
      - .:/root/.marckv.dots:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /root
    command: *docker-install
    networks:
      - marckv-net

  ubuntu24:
    image: ubuntu:24.04
    container_name: marckv-ubuntu-24
    hostname: ubuntu-24
    tty: true
    stdin_open: true
    environment:
      - DEBIAN_FRONTEND=noninteractive
    volumes:
      - .:/root/.marckv.dots:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /root
    command: *docker-install
    networks:
      - marckv-net

networks:
  marckv-net:
    driver: bridge
