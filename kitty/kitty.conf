# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{
font_family        MartianMono Nerd Font
# font_family        IosevkaTermSlab Nerd Font Mono
# font_family        GeistMono Nerd Font Mono
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          9
# font_weight        regular

remember_window_size  no
initial_window_width  1500
initial_window_height 700


# Para todos los enlaces
# open_url_with default
# O un script personalizado
# open_url_with /usr/bin/xdg-open

#: The foreground and background colors.
background_opacity  0.98
# background_blur     10

enable_audio_bell   no

# window_border_width 0.5pt
window_padding_width  1
placement_strategy center
window_margin_width 1

disable_ligatures never

scrollback_lines 200000
smooth_scrolling yes
wheel_scroll_multiplier 5

# map shift+drag_selection mouse_selection

# map ctrl+shift+s begin_selection
# map ctrl+shift+a end_selection

# Background image settings
# background_image /home/villcabo/Pictures/AnimeWallapaper/sung-jinwoo-shadow-summon-solo-leveling-arise-4k-wallpaper-uhdpaper.com-243@5@b.jpg
# background_image_linear yes
# tiled: , mirror-tiled, scaled, clamped, centered o cscaled
# background_image_layout cscaled
# dynamic_background_opacity yes
# background_tint 0.5
# background_tint_gaps 0.5
# background_opacity 0.95
# background_blur 100

# Top tab bar style: fade, slant, powerline, separator
# tab_bar_style separator
tab_bar_style powerline
# tab_bar_style slant
# tab_bar_style fade

term xterm-256color

# Font zoom (increase/decrease)
map ctrl+plus    change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0

map f11 toggle_fullscreen

# Key mappings
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Split horizontal (abajo) con Ctrl + Shift + -
# map ctrl+shift+- launch --location=hsplit
# map ctrl+shift+h launch --location=vsplit

# Cerrar ventana con Ctrl + Shift + x
# map ctrl+shift+x close_window

# map f5 launch --location=hsplit
# map f6 launch --location=vsplit

# BEGIN_KITTY_THEME
# Argonaut
# include current-theme.conf
# END_KITTY_THEME

# active_tab_foreground   #DCD7BA
# active_tab_background   #54546D
# active_tab_font_style   bold-italic
# inactive_tab_foreground #DCD7BA
# inactive_tab_background #2A2A37
# inactive_tab_font_style normal
# tab_bar_margin_color    #938AA9

# Recargar configuración con Ctrl + Shift + r
# map ctrl+shift+r reload_config

# make option key work for alt-f / alt-b
# macos_option_as_alt yes




#######################################
#   K I T T Y   C O N F I G   F U L L
#   Tema: Ottosson
#######################################

# Ajustes visuales de texto
# adjust_line_height       110%
# adjust_column_width      100%

# Ocultar barra de título de Windows (si no te gusta, cambia a yes)
hide_window_decorations  no

# Opacidad (0.0 = totalmente transparente, 1.0 = sólido)
background_opacity       0.96

# Confirmar al cerrar
confirm_os_window_close  1

###################
# CURSOR
###################
cursor_shape               block
cursor_blink_interval      0
cursor_stop_blinking_after 0

###################
# COMPORTAMIENTO
###################
enable_audio_bell        no
visual_bell_duration     0.15
detect_urls              yes
copy_on_select           no
strip_trailing_spaces    smart

###################
# SHELL (OPCIONAL)
###################
# Por defecto usa el shell del sistema.
# Si quieres forzar PowerShell, Coméntalo o descóméntalo según uses:
# shell C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
# shell C:\Program Files\PowerShell\7\pwsh.exe

###################
# TAB BAR
###################
tab_bar_style            powerline
# tab_bar_min_tabs         1
tab_title_template       "{index}: {title}"

active_tab_background    #2B3040
active_tab_foreground    #FFFFFF
inactive_tab_background  #181B22
inactive_tab_foreground  #808696

###################
# TECLAS ÚTILES
###################

# Pestañas
map ctrl+shift+t         new_tab
map ctrl+shift+w         close_tab
map ctrl+shift+page_up   previous_tab
map ctrl+shift+page_down next_tab

# Ventanas (splits)
map ctrl+shift+enter     new_window
map ctrl+shift+e         launch --location=hsplit
map ctrl+shift+o         launch --location=vsplit

# Navegar entre splits
map ctrl+shift+left      focus_window left
map ctrl+shift+right     focus_window right
map ctrl+shift+up        focus_window up
map ctrl+shift+down      focus_window down

# Redimensionar splits
map ctrl+alt+left        resize_window narrower
map ctrl+alt+right       resize_window wider
map ctrl+alt+up          resize_window taller
map ctrl+alt+down        resize_window shorter

# Copiar / pegar (estilo “normal” de Windows)
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard

########################################
#   T H E M E   O T T O S S O N   S O F T
########################################

